name: IsLandToken release

on:
  push:
    tags: ['islandtoken-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-arm64
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        run: test "$GITHUB_REF_NAME" = "islandtoken-v$(cat VERSION)"
      - name: Test
        run: ./script/test.sh
      - name: Build app and bundle collector
        run: |
          ./script/build_and_run.sh --build-only
          ./script/update_codexbar_cli.sh
          ./script/package_release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 --title "IsLandToken $(cat VERSION)" --notes-file docs/release-notes.md --verify-tag
